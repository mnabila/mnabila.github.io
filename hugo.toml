baseURL = 'https://mnabila.com'
locale = 'id'
title = 'MNABILA'
theme = 'bezelist'
ignoreFiles = ['themes/.*/content/*']

[module]
[module.hugoVersion]
extended = false
min = '0.146.0'
[[module.mounts]]
source = 'assets'
target = 'assets'

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = '(postcss|tailwind)\.config\.js'
target = 'css'

[caches]
[caches.images]
dir = ':cacheDir/images'


[params]
favicon = 'logo/favicon.ico'
[params.author]
name = 'Muhammad Nabil Adani'
subtitle = 'Software Engineer'
tagline = 'Building boringly stable systems. Fueled by caffeine, lo-fi beats, and a very patting the cat.'
logo = '/logo/mna.webp'
stack = [
  'docker',
  'go',
  'nextjs',
  'nodejs',
  'postgresql',
  'reactjs',
  'redis',
  'rust',
  'typescript',
]
[[params.social]]
name = 'GitHub'
url = 'https://github.com/mnabila'
icon = 'fa-brands fa-github'
[[params.social]]
name = 'GitLab'
url = 'https://gitlab.com/mnabila'
icon = 'fa-brands fa-gitlab'
[[params.social]]
name = 'Telegram'
url = 'https://t.me/mnabila'
icon = 'fa-brands fa-telegram'
[[params.social]]
name = 'LinkedIn'
url = 'https://linkedin.com/in/mnabila'
icon = 'fa-brands fa-linkedin'
[[params.social]]
name = 'X'
url = 'https://x.com/mnabila'
icon = 'fa-brands fa-x-twitter'
[[params.social]]
name = 'Email'
url = 'mailto:saya@mnabila.com'
icon = 'fa-solid fa-at'
[params.analytics]
google = 'G-7NVMRSNZL7'
cloudflare = ''
[params.banner]
text = 'Open to backend engineering roles'
cta = 'Get in touch'
[params.hero]
lines = ['I build backends', 'that stay', 'boring.']
highlight = 'boring.'
chip = 'v2026 / shipping'
[params.sections]
about = 'Who I am'
experience = 'Career'
education = 'Studied'
skill = 'What I do'
project = 'Selected work'
blog = 'From the blog'
contact = 'Get in touch'

[menus]
[[menus.main]]
name = 'Home'
pageRef = '/'
weight = 10
[[menus.main]]
name = 'Experience'
url = '/#experience'
weight = 20
[[menus.main]]
name = 'Skills'
url = '/#skill'
weight = 30
[[menus.main]]
name = 'Projects'
url = '/#project'
weight = 40
[[menus.main]]
name = 'Blog'
pageRef = '/blog'
weight = 50

[outputs]
section = ['html', 'rss', 'json']

[taxonomies]
tag = 'tags'

[markup]
[markup.highlight]
noClasses = false
lineNos = false
guessSyntax = true
[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false

[security]
[security.exec]
allow = [
  '^tailwindcss$',
  '^(dart-)?sass(-embedded)?$',
  '^go$',
  '^git$',
  '^npx$',
  '^postcss$',
  '^node$',
]
